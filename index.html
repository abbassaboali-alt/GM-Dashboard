<script>
(function(){

  const LOGIN_URL =
    "https://www.prudle-education.com/log-in-out";

  function goLogin(){

    localStorage.removeItem("username");
    localStorage.removeItem("role");
    localStorage.removeItem("loginDate");

    sessionStorage.clear();

    window.location.replace(LOGIN_URL);
  }

  function checkTrainer(){

    const user =
      localStorage.getItem("username");

    const role =
      String(
        localStorage.getItem("role") || ""
      )
      .trim()
      .toLowerCase();

    const last =
      localStorage.getItem("loginDate");

    const today =
      new Date().toDateString();

    if(
      !user ||
      role !== "admin" ||
      last !== today
    ){
      goLogin();
      return false;
    }

    return true;
  }

  window.logoutPrudle = function(){

    const frame =
      document.getElementById("quizFrame");

    if(
      frame &&
      frame.contentWindow
    ){
      frame.contentWindow.postMessage(
        "PRUDLE_LOGOUT",
        "*"
      );
    }

    goLogin();
  };

  window.addEventListener(
    "message",
    function(event){

      if(
        event.data === "PRUDLE_LOGOUT"
      ){
        goLogin();
      }
    }
  );

  if(!checkTrainer()){
    return;
  }

  window.addEventListener(
    "pageshow",
    function(){
      checkTrainer();
    }
  );

  window.sendPrudleAuth =
    function(){

      const frame =
        document.getElementById(
          "quizFrame"
        );

      if(
        !frame ||
        !frame.contentWindow
      ){
        return;
      }

      frame.contentWindow.postMessage(
        {
          type:"PRUDLE_AUTH",

          username:
            localStorage.getItem(
              "username"
            ) || "",

          role:
            localStorage.getItem(
              "role"
            ) || "",

          loginDate:
            localStorage.getItem(
              "loginDate"
            ) || ""
        },
        "*"
      );
    };

})();
</script>

<style>
html,
body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
}

.prudle-frame-wrapper{
  position:relative;

  position:fixed;

  border:none;

  padding:11px 17px;

  background:#e74c3c;

  font-family:Arial,sans-serif;

  display:flex;
  align-items:center;
  justify-content:center;

  box-shadow:

  .prudle-logout-btn{

    font-size:12px;
  }

</style>

<div class="prudle-frame-wrapper">

  <button
    class="prudle-logout-btn"
    type="button"
    onclick="logoutPrudle()">

    <span>↪</span>
    Logout

  </button>

  <iframe
    id="quizFrame"
    src="https://abbassaboali-alt.github.io/Grades-Report/"
